<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tugas 1 - Pengambil Keputusan Nilai</title>
</head>
<body>
    <h2>Aplikasi Penentuan Nilai Huruf</h2>
    <label for="inputNilai">Masukkan Nilai (0 - 100): </label>
    <input type="number" id="inputNilai" min="0" max="100">
    <button onclick="hitungNilai()">Hitung Grade</button>

    <h3 id="hasil"></h3>

    <script>
        function hitungNilai() {
            const nilaiInput = document.getElementById("inputNilai").value;
            const hasilElement = document.getElementById("hasil");

            if (nilaiInput === "") {
                alert("Harap masukkan nilai terlebih dahulu!");
                hasilElement.innerText = "";
                return;
            }

            const nilai = parseFloat(nilaiInput);

            if (nilai < 0 || nilai > 100) {
                alert("Nilai harus berada di rentang 0 - 100!");
                hasilElement.innerText = "";
                return;
            }

            let grade = "";
            if (nilai >= 0 && nilai <= 20) {
                grade = "E";
            } else if (nilai >= 21 && nilai <= 40) {
                grade = "D";
            } else if (nilai >= 41 && nilai <= 60) {
                grade = "C";
            } else if (nilai >= 61 && nilai <= 80) {
                grade = "B";
            } else if (nilai >= 81 && nilai <= 100) {
                grade = "A";
            }

            hasilElement.innerText = "Nilai Huruf Anda: " + grade;
        }
    </script>
</body>
</html>
