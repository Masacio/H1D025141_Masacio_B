<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Form Tugas HTML</title>
</head>
<body>

    <h2>Formulir Validasi Input</h2>

    <form action="#" method="POST">
        <label for="input1">Input 1 (Readonly):</label><br>
        <input type="text" id="input1" name="input1" value="Nilai Tetap" readonly><br><br>

        <label for="input2">Input 2 (Maks 5 Karakter):</label><br>
        <input type="text" id="input2" name="input2" maxlength="5"><br><br>

        <label for="input3">Input 3 (Disabled):</label><br>
        <input type="text" id="input3" name="input3" disabled><br><br>

        <label for="input4">Input 4 (Wajib Diisi):</label><br>
        <input type="text" id="input4" name="input4" required><br><br>

        <label for="input5">Input 5 (NIM):</label><br>
        <input type="text" id="input5" name="input5" pattern="[A-Z0-9]{9}" maxlength="9" title="Harus 9 karakter berupa huruf KAPITAL dan angka tanpa simbol" required><br><br>

        <input type="submit" value="Kirim Data">
    </form>

</body>
</html>
